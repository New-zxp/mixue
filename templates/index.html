<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="map-version" content="{{map_version}}"><meta name="research-token" content="{{token}}"><link rel="icon" href="/static/favicon.svg"><title>沈阳茶饮门店地图</title><link rel="stylesheet" href="/static/vendor/leaflet.css"><link rel="stylesheet" href="/static/style.css"></head>
<body><header class="toolbar"><h1>沈阳茶饮门店地图</h1><label>区域 <select id="district" aria-label="选择行政区"><option value="">沈阳九区</option></select></label><label class="basemap-label">底图 <select id="basemap" aria-label="选择底图"><option value="streets">街道图</option><option value="blank">空白图</option></select></label><div class="toolbar-actions"><button id="overview">九区全景</button><button id="toggle-plan" class="primary" aria-expanded="false" aria-controls="plan-panel">门店选址</button></div></header>
<main id="map-shell"><div id="map" aria-label="沈阳九区茶饮门店地图"></div>
<div class="map-filters" aria-label="地图门店筛选"><label><input type="checkbox" id="show-target" checked><i class="dot target"></i>蜜雪冰城 <span id="target-count">—</span></label><label><input type="checkbox" id="show-competitor" checked><i class="dot competitor"></i>其他茶饮 <span id="competitor-count">—</span></label><select id="brand" aria-label="筛选竞品品牌"><option value="">全部竞品品牌</option></select></div>
<details class="facility-filters"><summary>周边设施</summary><div id="facility-controls"></div><small>数量为当前行政区样本；地图显示视野内地点。</small></details>
<div id="basemap-status" role="status" hidden><span id="basemap-message"></span><button id="retry-basemap" hidden>重新加载</button></div><div id="notice" role="status" hidden></div><div class="map-caption"><strong id="region-title">沈阳九区</strong><span id="evidence-legend" hidden></span><span id="map-hint">滚轮放大查看街道，点击门店查看详情</span></div>
<aside id="plan-panel" hidden aria-label="门店选址"><div class="panel-heading"><h2>门店选址</h2><button id="close-plan" aria-label="关闭选址面板">×</button></div><div class="panel-scroll"><p class="intro">为蜜雪冰城寻找一处值得实地考察的位置。</p><div class="scope-line">当前区域 <strong id="scope-name">沈阳九区</strong></div>
<form id="place-form"><label for="place-query">具体地点附近 <span>可选</span></label><div class="search-box"><input id="place-query" maxlength="100" placeholder="输入学校、商场或地名" required><button id="search-place" type="submit">查找</button></div></form><div id="place-results"></div>
<div id="area-controls" hidden><div class="area-row"><label for="area-size">选址范围</label><select id="area-size"><option value="1000">地点周边1公里</option><option value="3000" selected>地点周边3公里</option><option value="5000">地点周边5公里</option></select></div><div class="selected-place"><span id="selected-place"></span><button id="clear-place">清除</button></div></div>
<button id="analyze" class="primary analyze" disabled>开始选址</button><p class="small">每次推荐一处，分析周边1公里的配套与竞争情况。</p><div id="result" aria-live="polite"><div class="initial-result">选择行政区，或查找一个具体地点后开始选址。结果会在地图上标出，并列出推荐依据。</div></div></div></aside><div class="source-note">高德 POI 样本 · 位置仅供考察参考</div></main>
<script src="/static/vendor/leaflet.js"></script><script src="/static/vendor/protomaps-leaflet.js"></script><script src="/static/basemaps.js"></script><script src="/static/app.js"></script></body></html>
